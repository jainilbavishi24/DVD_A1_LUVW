<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="460" viewBox="0 0 1120 460">
  <style>
    text { font-family: Arial, sans-serif; fill: #172033; }
    .title { font-size: 23px; font-weight: bold; }
    .sig { font-size: 18px; font-weight: bold; }
    .value { font-size: 16px; }
    .wave { stroke: #1e293b; stroke-width: 3; fill: none; }
    .bus { stroke: #2563eb; stroke-width: 3; fill: none; }
    .reset { stroke: #dc2626; stroke-width: 3; fill: none; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 5; }
    .edge { stroke: #16a34a; stroke-width: 2; stroke-dasharray: 4 4; }
  </style>
  <text x="560" y="34" text-anchor="middle" class="title">Waveform example: A = 10 (1010), B = 7 (0111), product = 70 (01000110)</text>
  <text x="70" y="110" class="sig">clk</text>
  <text x="70" y="180" class="sig">rst_n</text>
  <text x="70" y="250" class="sig">a[3:0]</text>
  <text x="70" y="315" class="sig">b[3:0]</text>
  <text x="70" y="385" class="sig">p[7:0]</text>

  <line class="guide" x1="170" y1="95" x2="1060" y2="95"/>
  <line class="guide" x1="170" y1="165" x2="1060" y2="165"/>
  <line class="guide" x1="170" y1="235" x2="1060" y2="235"/>
  <line class="guide" x1="170" y1="300" x2="1060" y2="300"/>
  <line class="guide" x1="170" y1="370" x2="1060" y2="370"/>

  <path class="wave" d="M170,110 L220,110 L220,80 L270,80 L270,110 L320,110 L320,80 L370,80 L370,110 L420,110 L420,80 L470,80 L470,110 L520,110 L520,80 L570,80 L570,110 L620,110 L620,80 L670,80 L670,110 L720,110 L720,80 L770,80 L770,110 L820,110 L820,80 L870,80 L870,110 L920,110 L920,80 L970,80 L970,110 L1020,110 L1020,80 L1060,80"/>
  <path class="reset" d="M170,190 L370,190 L370,150 L1060,150"/>
  <text x="270" y="213" text-anchor="middle" class="value">reset asserted</text>
  <text x="535" y="143" text-anchor="middle" class="value">reset released</text>

  <path class="bus" d="M170,260 L420,260 L440,240 L710,240 L730,260 L1060,260"/>
  <text x="280" y="253" text-anchor="middle" class="value">0000</text>
  <text x="575" y="232" text-anchor="middle" class="value">1010 (10), applied before edge 1</text>
  <path class="bus" d="M170,325 L420,325 L440,305 L710,305 L730,325 L1060,325"/>
  <text x="280" y="318" text-anchor="middle" class="value">0000</text>
  <text x="575" y="297" text-anchor="middle" class="value">0111 (7), applied before edge 1</text>
  <path class="bus" d="M170,395 L620,395 L640,375 L1060,375"/>
  <text x="385" y="388" text-anchor="middle" class="value">00000000</text>
  <text x="850" y="367" text-anchor="middle" class="value">01000110 (70), captured at edge 2</text>

  <line class="edge" x1="470" y1="58" x2="470" y2="415"/>
  <line class="edge" x1="570" y1="58" x2="570" y2="415"/>
  <text x="470" y="445" text-anchor="middle" class="value">edge 1: inputs captured</text>
  <text x="570" y="428" text-anchor="middle" class="value">edge 2: p = 70</text>
</svg>
